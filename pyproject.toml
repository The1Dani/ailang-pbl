[project]
name = "ailang"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "antlr4-grun>=0.1.0",
    "antlr4-python3-runtime==4.13.2",
    "pandas>=3.0.2",
    "catboost",
    "scikit-learn>=1.8.0",
    "numpy>=2.4.4",
    "joblib>=1.5.3",
]

[project.scripts]
ailang = "main:main"

[dependency-groups]
dev = [
    "black>=26.3.1",
    "pylint>=4.0.5",
    "pyright>=1.1.409",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = [
    "ailang"
]
exclude = [
    "./**/grammar/*",
]

[tool.black]
force-exclude = '''
(
  /grammar/
)
'''

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["main.py"]